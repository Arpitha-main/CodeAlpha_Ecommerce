<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>

<h1>My Cart</h1>

{% for product in products %}
    <h2>{{ product.name }}</h2>
    <p>₹{{ product.price }}</p>
{% empty %}
    <p>Your cart is empty.</p>
{% endfor %}
<h2>Total: ₹{{ total }}</h2>

<a href="/">Continue Shopping</a>

<a href="/">Continue Shopping</a>

</body>
</html>
